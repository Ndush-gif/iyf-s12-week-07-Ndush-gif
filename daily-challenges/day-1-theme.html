<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1: Theme Persistence</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; background: #ffffff; color: #1c2128; }
        body.dark { background: #1c2128; color: #f6f8fa; }
    </style>
</head>
<body>
    <h1>Theme Persistence</h1>
    <button type="button" id="theme-toggle">Switch theme</button>
    <script>
        const THEME_KEY = "theme";
        const toggle = document.getElementById("theme-toggle");

        function applyTheme(theme) {
            document.body.classList.toggle("dark", theme === "dark");
        }

        let theme = localStorage.getItem(THEME_KEY) || "light";
        applyTheme(theme);

        toggle.addEventListener("click", () => {
            theme = theme === "dark" ? "light" : "dark";
            localStorage.setItem(THEME_KEY, theme);
            applyTheme(theme);
        });
    </script>
</body>
</html>
