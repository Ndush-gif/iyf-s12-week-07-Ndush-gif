<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
</head>
<body>
    <header>
        <h1>Shop</h1>
        <p>Cart: <strong id="cart-count">0</strong> items</p>
    </header>

    <main>
        <section>
            <h2>Products</h2>
            <ul id="product-list"></ul>
        </section>

        <section>
            <h2>Your cart</h2>
            <ul id="cart-list"></ul>
            <p>Total: <strong id="cart-total">KSh 0</strong></p>
        </section>
    </main>

    <script src="cart.js"></script>
</body>
</html>
